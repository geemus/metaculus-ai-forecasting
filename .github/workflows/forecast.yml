name: Forecast

on:
  workflow_call:
    inputs:
      post_id:
        description: 'Metaculus post id to forecast:'
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      ASKNEWS_API_KEY:
        required: true
      METACULUS_BOT_API_TOKEN:
        required: true
      METACULUS_BOT_ID:
        required: true
      OPEN_ROUTER_API_KEY:
        required: true
      OPEN_ROUTER_OPENAI_API_KEY:
        required: true
      PERPLEXITY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Metaculus post id to forecast:'
        required: true
        type: string

# prevent parallel runs for same post_id
concurrency:
  group: ${{ github.workflow }}+${{ inputs.post_id }}
  cancel-in-progress: false

jobs:
  news:
    if: ${{ inputs.post_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news.md
          path: tmp/${{ inputs.post_id }}/outputs/news.md
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news_summary.md
          path: tmp/${{ inputs.post_id }}/outputs/news_summary.md
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec ruby news.rb ${{ inputs.post_id }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          METACULUS_BOT_API_TOKEN: ${{ secrets.METACULUS_BOT_API_TOKEN }}
          METACULUS_BOT_ID: ${{ secrets.METACULUS_BOT_ID }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPEN_ROUTER_OPENAI_API_KEY: ${{ secrets.OPEN_ROUTER_OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news.md
          path: tmp/${{ inputs.post_id }}/outputs/news.md
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news_summary.md
          path: tmp/${{ inputs.post_id }}/outputs/news_summary.md
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/news.json
          path: tmp/${{ inputs.post_id }}/news.json
      - run: |
          echo '<details><summary>Prompt</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/inputs/news.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Result</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/outputs/news.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>News Summary</summary>' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/outputs/news_summary.md)" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

  research:
    needs: news
    if: ${{ inputs.post_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news.md
          path: tmp/${{ inputs.post_id }}/outputs/news.md
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news_summary.md
          path: tmp/${{ inputs.post_id }}/outputs/news_summary.md
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/research.json
          path: tmp/${{ inputs.post_id }}/research.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec ruby tools_research.rb ${{ inputs.post_id }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METACULUS_BOT_API_TOKEN: ${{ secrets.METACULUS_BOT_API_TOKEN }}
          METACULUS_BOT_ID: ${{ secrets.METACULUS_BOT_ID }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/research.json
          path: tmp/${{ inputs.post_id }}/research.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.post_id }}.research.json
          path: tmp/${{ inputs.post_id }}/research.json
      - run: |
          echo "# $(cat tmp/${{ inputs.post_id }}/post.json | jq -r '.title')" >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/post.json | jq -r '.question.description')" >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Prompt</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/inputs/research.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Result</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/outputs/research.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

  forecasters:
    if: ${{ inputs.post_id }}
    runs-on: ubuntu-latest
    outputs:
      forecasters: ${{ steps.forecasters.outputs.forecasters }}
    steps:
      - uses: actions/checkout@v7
      - id: forecasters
        run: echo "forecasters=$(jq -c . forecasters.json)" >> "$GITHUB_OUTPUT"

  forecast:
    needs: [forecasters, research]
    if: ${{ inputs.post_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        forecaster: ${{ fromJSON(needs.forecasters.outputs.forecasters) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/research.json
          path: tmp/${{ inputs.post_id }}/research.json
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/forecasts/forecast.${{ matrix.forecaster }}.json
          path: tmp/${{ inputs.post_id }}/forecasts/forecast.${{ matrix.forecaster }}.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec ruby forecast.rb ${{ inputs.post_id }} ${{ matrix.forecaster }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METACULUS_BOT_API_TOKEN: ${{ secrets.METACULUS_BOT_API_TOKEN }}
          METACULUS_BOT_ID: ${{ secrets.METACULUS_BOT_ID }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPEN_ROUTER_OPENAI_API_KEY: ${{ secrets.OPEN_ROUTER_OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/forecasts/forecast.${{ matrix.forecaster }}.json
          path: tmp/${{ inputs.post_id }}/forecasts/forecast.${{ matrix.forecaster }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.post_id }}.forecast.${{ matrix.forecaster }}.json
          path: tmp/${{ inputs.post_id }}/forecasts/forecast.${{ matrix.forecaster }}.json
      - run: |
          bundle exec ruby forecast_result.rb ${{ inputs.post_id }} ${{ matrix.forecaster }} forecast >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      - run: |
          echo '<details><summary>Prompt</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/inputs/forecast.${{ matrix.forecaster }}.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Result</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/outputs/forecast.${{ matrix.forecaster }}.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

  revise_forecast:
    needs: [forecast, forecasters]
    if: ${{ inputs.post_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        forecaster: ${{ fromJSON(needs.forecasters.outputs.forecasters) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/research.json
          path: tmp/${{ inputs.post_id }}/research.json
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.post_id }}.forecast.*
          path: tmp/${{ inputs.post_id }}/forecasts
          merge-multiple: true
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/forecasts/revision.${{ matrix.forecaster }}.json
          path: tmp/${{ inputs.post_id }}/forecasts/revision.${{ matrix.forecaster }}.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec ruby revise_forecast.rb ${{ inputs.post_id }} ${{ matrix.forecaster }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METACULUS_BOT_API_TOKEN: ${{ secrets.METACULUS_BOT_API_TOKEN }}
          METACULUS_BOT_ID: ${{ secrets.METACULUS_BOT_ID }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPEN_ROUTER_OPENAI_API_KEY: ${{ secrets.OPEN_ROUTER_OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/forecasts/revision.${{ matrix.forecaster }}.json
          path: tmp/${{ inputs.post_id }}/forecasts/revision.${{ matrix.forecaster }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.post_id }}.revised_forecast.${{ matrix.forecaster }}.json
          path: tmp/${{ inputs.post_id }}/forecasts/revision.${{ matrix.forecaster }}.json
      - run: |
          bundle exec ruby forecast_result.rb ${{ inputs.post_id }} ${{ matrix.forecaster }} revision >> $GITHUB_STEP_SUMMARY
        continue-on-error: true
      - run: |
          echo '<details><summary>Prompt</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/inputs/revision.${{ matrix.forecaster }}.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Result</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/outputs/revision.${{ matrix.forecaster }}.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY

  consensus:
    needs: revise_forecast
    if: ${{ inputs.post_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/research.json
          path: tmp/${{ inputs.post_id }}/research.json
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/outputs/news_summary.md
          path: tmp/${{ inputs.post_id }}/outputs/news_summary.md
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/news.json
          path: tmp/${{ inputs.post_id }}/news.json
      # Original (pre-Delphi) forecasts: the comment builder reads them for
      # each forecaster's pre_revision value.
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.post_id }}.forecast.*
          path: tmp/${{ inputs.post_id }}/forecasts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.post_id }}.revised_forecast.*
          path: tmp/${{ inputs.post_id }}/forecasts
          merge-multiple: true
      - uses: actions/cache/restore@v6
        with:
          key:  tmp/${{ inputs.post_id }}/forecasts/consensus.json
          path: tmp/${{ inputs.post_id }}/forecasts/consensus.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - run: bundle exec ruby consensus.rb ${{ inputs.post_id }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METACULUS_BOT_API_TOKEN: ${{ secrets.METACULUS_BOT_API_TOKEN }}
          METACULUS_BOT_ID: ${{ secrets.METACULUS_BOT_ID }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          OPEN_ROUTER_OPENAI_API_KEY: ${{ secrets.OPEN_ROUTER_OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - uses: actions/cache/save@v6
        with:
          key:  tmp/${{ inputs.post_id }}/forecasts/consensus.json
          path: tmp/${{ inputs.post_id }}/forecasts/consensus.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.post_id }}.consensus.json
          path: tmp/${{ inputs.post_id }}/forecasts/consensus.json
      - run: |
          echo "$(cat tmp/${{ inputs.post_id }}/consensus/forecast.json | jq -r '.[] | .continuous_cdf // .probability_yes // .probability_yes_per_category')" >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Prompt</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/inputs/consensus.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo '<details><summary>Result</summary>' >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/outputs/consensus.md)" >> $GITHUB_STEP_SUMMARY
          echo '</details>' >> $GITHUB_STEP_SUMMARY
      - run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$(cat tmp/${{ inputs.post_id }}/consensus/comment.json | jq -r '.text')" >> $GITHUB_STEP_SUMMARY
