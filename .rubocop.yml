AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'tmp/**/*'
    - 'coverage/**/*'
    - 'vendor/**/*'

# Size and complexity limits are off: prompt-building methods and pipeline
# scripts are long by nature, and splitting them to satisfy the limits adds
# churn without improving clarity. Nesting depth and parameter counts stay on;
# they flag real design smells and have few exceptions (disabled inline).
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false

# Prompts and their helpers are prose-heavy; wrapping them for line length
# hurts readability. (Edits to lib/prompts.rb also change the prompt-version
# hash, so purely cosmetic rewrites there should be avoided.)
Layout/LineLength:
  Enabled: false

# Test names like `test_cdf_stays_within_0_1` read better than the alternatives.
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# RuboCop defaults plus conventional single-letter names in math helpers
# (logit(p), sigmoid(x), ...).
Naming/MethodParameterName:
  AllowedNames: [a, as, at, by, cc, db, id, if, in, io, ip, of, on, os, p, pp, q, to, x]
